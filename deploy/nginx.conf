# CraveCart edge — published on 127.0.0.1:6002, reached publicly via the Tailscale
# funnel path mount:  https://<ts-node>.ts.net/cravecart  →  http://127.0.0.1:6002
# The funnel strips the /cravecart prefix, so everything below sees root-relative paths.
#
# Public consumers: the mobile APK (API + sockets + uploads only).
# The web consoles are for local use: http://127.0.0.1:6002/{,admin,partner,rider}
# (over the funnel their absolute asset paths would escape the /cravecart prefix).

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # The storefront is served under /cravecart so its URLs survive the funnel (which strips
    # the prefix before we see it). Locally the prefix arrives intact — strip it here and
    # re-match, so http://127.0.0.1:6002/cravecart/... and /... behave identically.
    #
    # Do NOT redirect /cravecart → /cravecart/ here. Next's basePath serves the storefront root
    # as "/cravecart" (no trailing slash) and 308s "/cravecart/" back to it, so a redirect in the
    # other direction loops forever. Normalize to the prefix-less form and let `location = /`
    # below re-add it.
    location /cravecart/ {
        rewrite ^/cravecart(/.*)$ $1 last;
    }
    location = /cravecart {
        rewrite ^ / last;
    }

    location /api/ {
        set $up http://cravecart-api:5000;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        set $up http://cravecart-api:5000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        set $up http://cravecart-api:5000;
        proxy_pass $up;
    }

    # shareable build artifacts (mobile APK) — files from deploy/public/apk
    location /apk/ {
        root /usr/share/nginx/html;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        autoindex on;
    }

    # variable proxy_pass skips nginx's automatic prefix replacement,
    # so strip the console prefixes explicitly
    location /admin/ {
        set $up http://cravecart-admin:5174;
        rewrite ^/admin(/.*)$ $1 break;
        proxy_pass $up;
    }
    location /partner/ {
        set $up http://cravecart-partner:5175;
        rewrite ^/partner(/.*)$ $1 break;
        proxy_pass $up;
    }
    location /rider/ {
        set $up http://cravecart-rider:5176;
        rewrite ^/rider(/.*)$ $1 break;
        proxy_pass $up;
    }

    # The storefront is a Next.js server with basePath=/cravecart, so it expects to be
    # addressed *with* the prefix — but both paths that reach here have already lost it
    # (the funnel strips it; the /cravecart/ block above rewrites it away). Put it back.
    # $uri is the post-rewrite path, so funnel (/cart) and local (/cravecart/cart) both
    # arrive here as /cart and go upstream as /cravecart/cart.

    # The site root is the one case that must NOT gain a trailing slash: Next serves the
    # basePath root as "/cravecart" and would 308 "/cravecart/" straight back at us.
    location = / {
        set $up http://cravecart-frontend:3000;
        proxy_pass $up/cravecart;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $up http://cravecart-frontend:3000;
        proxy_pass $up/cravecart$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
