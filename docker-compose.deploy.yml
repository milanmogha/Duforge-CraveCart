# Self-hosted CraveCart deploy — fully self-contained (own Mongo, own edge nginx),
# same pattern as makhana/vanam.
#   Build & run:  docker compose -f docker-compose.deploy.yml up -d --build
#   Seed:         docker compose -f docker-compose.deploy.yml exec cravecart-api node src/seed/seed.js
#   Local edge:   http://127.0.0.1:6002  (/, /admin, /partner, /rider, /api)
#   Public API:   https://aakash-ideapad-3-15iml05-u-1.tail7a4203.ts.net/cravecart
#                 (tailscale funnel --bg --set-path=/cravecart http://127.0.0.1:6002)
name: cravecart

services:
  cravecart-mongo:
    image: mongo:7
    container_name: cravecart-mongo
    restart: unless-stopped
    volumes:
      - cravecart_mongo_data:/data/db
    networks: [cravecart]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 15s
      timeout: 5s
      retries: 5

  cravecart-api:
    build: ./backend
    container_name: cravecart-api
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://cravecart-mongo:27017/cravecart_v2
    volumes:
      - cravecart_uploads:/app/uploads
    depends_on:
      cravecart-mongo:
        condition: service_healthy
    networks: [cravecart]
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(5000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cravecart-frontend:
    build:
      context: ./frontend
      args:
        # public shape: https://<funnel-host>/cravecart (nginx also re-routes /cravecart/* locally)
        NEXT_PUBLIC_BASE_PATH: /cravecart
    container_name: cravecart-frontend
    restart: unless-stopped
    networks: [cravecart]
    expose:
      - "3000"

  cravecart-admin:
    build:
      context: ./admin
      args:
        VITE_BASE_PATH: /admin
    container_name: cravecart-admin
    restart: unless-stopped
    networks: [cravecart]
    expose:
      - "5174"

  cravecart-partner:
    build:
      context: ./partner
      args:
        VITE_BASE_PATH: /partner
    container_name: cravecart-partner
    restart: unless-stopped
    networks: [cravecart]
    expose:
      - "5175"

  cravecart-rider:
    build:
      context: ./rider
      args:
        VITE_BASE_PATH: /rider
    container_name: cravecart-rider
    restart: unless-stopped
    networks: [cravecart]
    expose:
      - "5176"

  cravecart-nginx:
    image: nginx:1.27-alpine
    container_name: cravecart-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:6002:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/public/apk:/usr/share/nginx/html/apk:ro
    depends_on:
      - cravecart-api
      - cravecart-frontend
      - cravecart-admin
      - cravecart-partner
      - cravecart-rider
    networks: [cravecart]

networks:
  cravecart:
    name: cravecart

volumes:
  cravecart_mongo_data:
  cravecart_uploads:
