# Self-hosted DapiGO deploy — fully self-contained (own Mongo, own edge nginx),
# same pattern as makhana/vanam.
#   Build & run:  docker compose -f docker-compose.deploy.yml up -d --build
#   Seed:         docker compose -f docker-compose.deploy.yml exec dapigo-api node src/seed/seed.js
#   Local edge:   http://127.0.0.1:6002  (/, /admin, /partner, /rider, /api)
#   Public API:   https://aakash-ideapad-3-15iml05-u-1.tail7a4203.ts.net/dapigo
#                 (tailscale funnel --bg --set-path=/dapigo http://127.0.0.1:6002)
name: dapigo

services:
  dapigo-mongo:
    image: mongo:7
    container_name: dapigo-mongo
    restart: unless-stopped
    volumes:
      - dapigo_mongo_data:/data/db
    networks: [dapigo]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 15s
      timeout: 5s
      retries: 5

  dapigo-api:
    build: ./backend
    container_name: dapigo-api
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://dapigo-mongo:27017/dapigo_v2
    volumes:
      - dapigo_uploads:/app/uploads
    depends_on:
      dapigo-mongo:
        condition: service_healthy
    networks: [dapigo]
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(5000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dapigo-frontend:
    build:
      context: ./frontend
      args:
        # public shape: https://<funnel-host>/dapigo (nginx also re-routes /dapigo/* locally)
        NEXT_PUBLIC_BASE_PATH: /dapigo
    container_name: dapigo-frontend
    restart: unless-stopped
    networks: [dapigo]
    expose:
      - "3000"

  dapigo-admin:
    build:
      context: ./admin
      args:
        VITE_BASE_PATH: /admin
    container_name: dapigo-admin
    restart: unless-stopped
    networks: [dapigo]
    expose:
      - "5174"

  dapigo-partner:
    build:
      context: ./partner
      args:
        VITE_BASE_PATH: /partner
    container_name: dapigo-partner
    restart: unless-stopped
    networks: [dapigo]
    expose:
      - "5175"

  dapigo-rider:
    build:
      context: ./rider
      args:
        VITE_BASE_PATH: /rider
    container_name: dapigo-rider
    restart: unless-stopped
    networks: [dapigo]
    expose:
      - "5176"

  dapigo-nginx:
    image: nginx:1.27-alpine
    container_name: dapigo-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:6002:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/public/apk:/usr/share/nginx/html/apk:ro
    depends_on:
      - dapigo-api
      - dapigo-frontend
      - dapigo-admin
      - dapigo-partner
      - dapigo-rider
    networks: [dapigo]

networks:
  dapigo:
    name: dapigo

volumes:
  dapigo_mongo_data:
  dapigo_uploads:
